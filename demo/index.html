<!DOCTYPE html>
<html>
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no, user-scalable=yes">
		<script type="module">
			import '../dist/gantt-chart.umd.js';
		</script>
	</head>
	<style>
		@import url('https://fonts.googleapis.com/css?family=Lato:400,700&display=swap');
		/*
			CSS custom properties penetrate the Shadow DOM.
			They are useful to provide custom styling.
		*/
		gantt-chart {
			--font-family: 'Lato', sans-serif;
			--background-color: #f6f8fa;
			--c1: lightblue;
		}
	</style>
	<body>
		<gantt-chart
			width="1150"
			height="700"
			margin-top="40"
			margin-left="40"
			margin-right="210"
			margin-bottom="160"
		></gantt-chart>

		<h2>Dependencies, today marker and zoom</h2>
		<button id="zoom-toggle">zoom: 1x</button>
		<div style="overflow-x: auto;">
			<gantt-chart
				id="zoomable"
				width="1150"
				height="500"
				margin-top="40"
				margin-left="40"
				margin-right="210"
				margin-bottom="60"
			></gantt-chart>
		</div>
	</body>
	<script>
		const element = document.querySelector('gantt-chart');

		const data = {
			milestones: [
				{
					id: 1,
					taskId: 6,
					title: 'Milestone B',
					date: 'April 2019'
				},
				{
					id: 2,
					taskId: 7,
					title: 'Milestone A',
					date: 'January 2019'
				},
				{
					id: 3,
					taskId: 11,
					title: 'Milestone C',
					date: 'September 2019'
				},
			],
			tasks: [
				{
					id: 1,
					title: 'task 1',
					start: 0,
					duration: 4,
					class: 'c1',
					progress: .65
				},
				{
					id: 2,
					title: 'task 2',
					start: 4,
					duration: 3,
					class: 'c1',
					progress: .45
				},
				{
					id: 3,
					title: 'task 3',
					start: 5,
					duration: 4,
					class: 'c1',
					progress: .15
				},
				{
					id: 4,
					title: 'task 4',
					start: 7,
					duration: 2,
					class: 'c1'
				},
				{
					id: 5,
					title: 'task 5',
					start: 8,
					duration: 4,
					class: 'c1',
				},
				{
					id: 6,
					title: 'task 6',
					start: 10,
					duration: 4,
					class: 'c1',
				},
				{
					id: 7,
					title: 'task 7',
					start: 0,
					duration: 4,
					class: 'c3',
					progress: 1.
				},
				{
					id: 8,
					title: 'task 8',
					start: 11,
					duration: 5,
					class: 'c3',
				},
				{
					id: 9,
					title: 'task 9',
					start: 14,

				{
					id: 10,

					start: 16,

				},
				{
					id: 11,

					start: 21,
					duration: 6,
					class: 'c3'
				},
				{
					id: 12,
					title: 'task 12',
					start: 25,
					duration: 2,
					class: 'c3'
				}
			]
		};

		element.data = data;

		const zoomable = document.querySelector('#zoomable');
		zoomable.now = 6;
		zoomable.data = {
			dependencies: [
				{from: 1, to: 2},
				{from: 2, to: 3},
				{from: 3, to: 5},
				{from: 4, to: 6}
			],
			milestones: [
				{
					id: 1,
					taskId: 5,
					title: 'Release',
					date: 'June 2026'
				}
			],
			tasks: [
				{

				{

				{
					id: 6,
					title: 'release',
					start: 10,
					duration: 2,
					class: 'c3'
				}
			]
		};

		const zoomLevels = [1, 2, 4];
		let zoomIndex = 0;
		const button = document.querySelector('#zoom-toggle');
		button.addEventListener('click', () => {
			zoomIndex = (zoomIndex + 1) % zoomLevels.length;
			zoomable.zoom = zoomLevels[zoomIndex];
			button.textContent = `zoom: ${zoomLevels[zoomIndex]}x`;
		});
	</script>
</html>
